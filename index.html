<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Панель модератора</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Анимация загрузки */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 1s ease, visibility 1s ease;
    }
    
    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }
    
    .loading-content {
      text-align: center;
    }
    
    .loading-icon {
      font-size: 48px;
      animation: bounce 0.8s ease infinite alternate;
    }
    
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-20px); }
    }
    
    .loading-text {
      color: #ffd700;
      font-size: 14px;
      margin-top: 20px;
      text-shadow: 2px 2px 0 #3d1c1c;
    }
    
    .loading-bar {
      width: 200px;
      height: 4px;
      background: #3d1c1c;
      margin: 15px auto 0;
      border: 2px solid #5c3a1e;
      position: relative;
      overflow: hidden;
    }
    
    .loading-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 60%;
      background: #ffd700;
      animation: loading 3s ease infinite;
    }
    
    @keyframes loading {
      0% { left: -60%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>

  <div class="particles"></div>
  
  <!-- Экран загрузки -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-content">
      <div class="loading-icon">⛏️</div>
      <div class="loading-text">Загрузка панели...</div>
      <div class="loading-bar"></div>
    </div>
  </div>
  
  <div id="app" class="container"></div>
