<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Тест</title>
  <style>
    body { background: #1a0a0a; color: white; font-family: Arial; padding: 50px; }
  </style>
</head>
<body>
  <h1>Тестовая страница</h1>
  <div id="test1">Проверка 1: если ты видишь этот текст, HTML работает</div>
  
  <script>
    document.write('<div style="color: green;">Проверка 2: JavaScript работает</div>')
    
    var div = document.getElementById('test1')
    if (div) {
      div.style.color = 'yellow'
      div.textContent = div.textContent + ' ✓'
    }
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    if (window.supabase) {
      document.write('<div style="color: green;">Проверка 3: Supabase загружен ✓</div>')
    }
  </script>
</body>
</html>
